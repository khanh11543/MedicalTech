app.backup.max-retention-days=90
app.backup.mysql-dump-path=C:/Program Files/MySQL/MySQL Server 8.0/bin/mysqldump.exe
app.backup.mysql-restore-path=C:/Program Files/MySQL/MySQL Server 8.0/bin/mysql.exe
app.backup.max-backup-size-gb=10
